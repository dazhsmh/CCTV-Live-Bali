<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto Mode - CCTV Live Denpasar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<link rel="stylesheet" href="auto.css">
</head>
<body>
<div class="stage" id="stage">
  <video id="kv" muted autoplay playsinline></video>
  <div class="msg" id="msg" hidden></div>
  <div class="shade top-shade"></div>
  <div class="shade bottom-shade"></div>

  <div class="top">
    <a class="kbtn" href="index.html" data-i18n="k_back">← Kembali</a>
    <div class="wx" id="wx" hidden><span class="wx-ic" aria-hidden="true"></span><span class="wx-t"><b></b><small></small></span></div>
    <div class="kclock"><b id="jam">--:--:--</b><span id="tgl"></span></div>
  </div>

  <div class="bottom">
    <div class="kinfo">
      <span class="ktag" id="ktag"></span>
      <b id="kname"></b>
      <span id="kdetail"></span>
      <small id="kcount"></small>
    </div>
    <div class="kctl">
      <button type="button" id="kprev" class="kbtn" data-i18n="k_prev">Sebelumnya</button>
      <button type="button" id="kpause" class="kbtn" data-i18n="k_pause">Jeda</button>
      <button type="button" id="knext" class="kbtn" data-i18n="k_next">Berikutnya</button>
      <label class="ksel"><span data-i18n="k_every">Ganti tiap</span> <select id="ksecs"></select></label>
      <label class="ksel"><span data-i18n="k_source">Sumber</span> <select id="ksrc"></select></label>
      <button type="button" id="kfull" class="kbtn" data-i18n="k_full">Layar penuh</button>
      <button type="button" id="klang" class="kbtn" data-i18n="langbtn">EN</button>
    </div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="cameras.js"></script>
<script src="common.js"></script>
<script src="player.js"></script>
<script src="auto.js"></script>
</body>
</html>
